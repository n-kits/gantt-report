<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разбор мест</title>
<!-- шаблон страницы geo_manual.py: __DATA__ подставляет сервер -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --text: #1F2937; --gray: #6B7280; --line: #E5E7EB; --bg: #F9FAFB; --a: #2563EB; --b: #EA580C;
          --ok: #15803D; --pick: #7C3AED; --warn: #B42318; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: #fff; }
  header { position: sticky; top: 0; z-index: 1000; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  .tabs button { border: 1px solid var(--line); background: #fff; padding: 5px 10px; cursor: pointer; font: inherit; }
  .tabs button:first-child { border-radius: 6px 0 0 6px; }
  .tabs button + button { border-left: 0; }
  .tabs button:last-child { border-radius: 0 6px 6px 0; }
  #q { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; width: 180px; }
  .acts button.skip.on { background: var(--warn); border-color: var(--warn); color: #fff; }
  .dec.skip { color: var(--warn); }
  .item.gone h3 { text-decoration: line-through; }
  .tabs button.on { background: var(--text); color: #fff; border-color: var(--text); }
  .grow { flex: 1; }
  .sub { color: var(--gray); }
  #save { background: var(--ok); color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  #save:disabled { background: #D1D5DB; cursor: default; }
  main { display: grid; grid-template-columns: minmax(380px, 46%) 1fr; height: calc(100vh - 53px); }
  #list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg); padding: 10px; }
  #map { height: 100%; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; padding: 10px 12px; cursor: pointer; }
  .item.sel { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .item.done { opacity: .75; }
  .item h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
  .item h3 .km { margin-left: auto; font-weight: 600; color: var(--warn); }
  .pt { border-top: 1px dashed var(--line); padding: 6px 0 2px; }
  .pt:first-of-type { border-top: 0; }
  .tag { display: inline-block; width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700;
         text-align: center; line-height: 18px; margin-right: 4px; }
  .tag.a { background: var(--a); } .tag.b { background: var(--b); } .tag.e { background: var(--warn); }
  .meta { color: var(--gray); font-size: 12px; }
  .tasks { margin: 4px 0 0 22px; padding: 0; list-style: none; font-size: 12px; }
  .tasks li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tasks a { color: inherit; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0 2px 22px; }
  .acts button, .acts a { font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 5px;
                          background: #fff; cursor: pointer; color: inherit; text-decoration: none; }
  .acts button.ok.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .acts button.pick.on { background: var(--pick); border-color: var(--pick); color: #fff; }
  .acts input { font: inherit; font-size: 12px; width: 150px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 5px; }
  .dec { margin-left: 22px; font-size: 12px; font-weight: 600; }
  .dec.ok { color: var(--ok); } .dec.coords { color: var(--pick); }
  .warn { color: var(--warn); font-size: 12px; margin-left: 22px; }
  .acts.merge { margin: 8px 0 2px; padding-top: 8px; border-top: 1px solid var(--line); }
  .empty { padding: 20px; color: var(--gray); }
  #msg { font-size: 12px; }
  .hint { position: absolute; z-index: 1000; top: 10px; left: 50%; transform: translateX(-50%); background: var(--pick); color: #fff;
          padding: 4px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; height: auto; }
    #list { order: 2; } #map { height: 50vh; order: 1; } }
</style>
</head>
<body>
<header>
  <h1>Разбор мест</h1>
  <div class="tabs"><button data-tab="pairs"></button><button data-tab="est"></button><button data-tab="all"></button></div>
  <input id="q" type="search" placeholder="Найти место…">
  <span class="sub" id="info"></span>
  <span class="grow"></span>
  <span id="msg" class="sub"></span>
  <button id="save" disabled>Сохранить</button>
</header>
<main>
  <div id="list"></div>
  <div style="position:relative"><div id="map"></div><div class="hint" id="hint" hidden>Кликните по карте — там место</div></div>
</main>
<script>
'use strict';
const DATA = __DATA__;
const STORE = 'geo-manual-decisions';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SRC = { cache: 'кэш', nominatim: 'Nominatim', llm: 'оценка модели', basemap: 'полигон страны', manual: 'вручную' };
const COLORS = ['#2563EB', '#EA580C', '#0D9488', '#9333EA', '#CA8A04', '#DB2777', '#4B5563', '#65A30D', '#0891B2', '#B45309'];
const LETTERS = 'ABCDEFGHIJ';
const TABS = { pairs: 'Подозрительные пары', est: 'Оценки модели', all: 'Все места' };
const SHOW_MAX = 150;                     // «Все места»: сколько карточек рисовать (остальное — через поиск)
let tab = 'pairs', selId = null, picking = null;
let dec = {};
try { dec = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { dec = {}; }
const keep = () => { try { localStorage.setItem(STORE, JSON.stringify(dec)); } catch (e) { /* без памяти */ } };

const query = () => document.getElementById('q').value.trim().toLowerCase().replace(/ё/g, 'е');
const items = () => {
  const q = query();
  return q ? DATA[tab].filter(it => it.name.toLowerCase().replace(/ё/g, 'е').includes(q)) : DATA[tab];
};
const ALL = () => DATA.pairs.concat(DATA.est, DATA.all);
const byId = id => ALL().find(it => it.id === id);
// решение — по самой точке (название, регионы модели, координаты), а не по номеру карточки: номера меняются
// при обновлении списка, а одна точка бывает на нескольких вкладках
const pkey = (it, i) => `${it.points[i].name}|${it.points[i].macros.join('/')}|${it.points[i].lat},${it.points[i].lon}`;

// --- карта ---------------------------------------------------------------
const map = L.map('map', { zoomControl: true }).setView([48.5, 37], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '&copy; участники OpenStreetMap',
}).addTo(map);
const layer = L.layerGroup().addTo(map);

function drawMap(fit) {
  layer.clearLayers();
  const it = selId && byId(selId);
  if (!it) return;
  const pts = [];
  it.points.forEach((p, i) => {
    const col = it.points.length > 1 ? COLORS[i % COLORS.length] : '#B42318';
    const label = it.points.length > 1 ? LETTERS[i] : '';
    L.circleMarker([p.lat, p.lon], { radius: 9, color: '#fff', weight: 2, fillColor: col, fillOpacity: .95 })
      .bindTooltip(`${label ? label + ' · ' : ''}${esc(p.name)} — ${esc(p.region || p.country || '')}<br>${(p.src || []).map(s => SRC[s] || s).join(', ')}`)
      .addTo(layer);
    pts.push([p.lat, p.lon]);
    const d = dec[pkey(it, i)];
    if (d && d.type === 'coords') {
      const m = L.marker([d.lat, d.lon], { draggable: true, title: 'новая точка ' + label }).addTo(layer)
        .bindTooltip(`новая точка ${label}`, { permanent: true, direction: 'right', offset: [10, -14] });
      m.on('dragend', () => { const c = m.getLatLng(); setCoords(it, i, c.lat, c.lng); });
      L.polyline([[p.lat, p.lon], [d.lat, d.lon]], { color: col, dashArray: '4 4', weight: 2 }).addTo(layer);
      pts.push([d.lat, d.lon]);
    }
  });
  if (fit) {
    if (pts.length > 1) map.fitBounds(pts, { padding: [60, 60], maxZoom: 11 });
    else map.setView(pts[0], 10);
  }
}

map.on('click', e => {
  if (!picking) return;
  const [id, i] = picking;
  if (i === 'all') setMerged(byId(id), e.latlng.lat, e.latlng.lng);
  else setCoords(byId(id), i, e.latlng.lat, e.latlng.lng);
  picking = null;
  document.getElementById('hint').hidden = true;
  render();
});

// --- решения -------------------------------------------------------------
function setCoords(it, i, lat, lon, merged) {
  const d = dec[pkey(it, i)] = { type: 'coords', lat: +lat.toFixed(5), lon: +lon.toFixed(5), merged: !!merged };
  keep(); render(); drawMap(false);
  regionOf(d);
}
// пара — одно место: обе точки (все их регионы у модели) — в одни координаты
function setMerged(it, lat, lon) {
  it.points.forEach((p, i) => setCoords(it, i, lat, lon, true));
}
// куда попадёт новая точка: регион и страну считает сервер так же, как потом архив (по координатам)
const regions = {};
async function regionOf(d) {
  const k = d.lat + ',' + d.lon;
  if (!(k in regions)) {
    try { regions[k] = await (await fetch(`/region?lat=${d.lat}&lon=${d.lon}`)).json(); } catch (e) { regions[k] = {}; }
  }
  d.region = regions[k].region || regions[k].country || '';
  keep(); render();
}
// координаты точки пары: новые, если заданы, иначе — как есть
function coordsOf(it, i) {
  const d = dec[pkey(it, i)];
  return d && d.type === 'coords' ? [d.lat, d.lon] : [it.points[i].lat, it.points[i].lon];
}
function toggleOk(it, i) {
  const k = pkey(it, i);
  if (dec[k] && dec[k].type === 'ok') delete dec[k]; else dec[k] = { type: 'ok' };
  keep(); render(); drawMap(false);
}
// не топоним — слово, а не место: отмечается всё название (во всех регионах)
function toggleSkip(it) {
  const on = it.points.every((p, i) => (dec[pkey(it, i)] || {}).type === 'skip');
  it.points.forEach((p, i) => { if (on) delete dec[pkey(it, i)]; else dec[pkey(it, i)] = { type: 'skip' }; });
  keep(); render(); drawMap(false);
}
function reset(it, i) { delete dec[pkey(it, i)]; keep(); render(); drawMap(false); }
function parseCoords(s) {
  const m = String(s).trim().match(/^(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)$/);
  if (!m) return null;
  const lat = +m[1].replace(',', '.'), lon = +m[2].replace(',', '.');
  return Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? [lat, lon] : null;
}

const pinned = p => (p.src || []).includes('llm');
function rows() {
  const day = new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
  const out = [], seen = new Set();
  const add = r => { const k = r.slice(0, 4).join(';').toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(r); } };
  ALL().forEach(it => it.points.forEach((p, i) => {
    const d = dec[pkey(it, i)];
    if (!d) return;
    if (d.type === 'skip') return add([p.name, '', 'не топоним', '', `разбор ${day}`]);
    // «верно» для оценки модели закрепляет её точку: иначе следующая оценка ляжет в другом месте
    const pin = d.type === 'ok' && pinned(p);
    (p.macros.length ? p.macros : ['']).forEach(r => add(d.type === 'coords'
      ? [p.name, r, d.lat, d.lon, `разбор ${day}`]
      : pin ? [p.name, r, p.lat.toFixed(5), p.lon.toFixed(5), `разбор ${day}: верно, точка модели`]
      : [p.name, r, '', '', `разбор ${day}: верно`]));
  }));
  return out;
}

// --- список --------------------------------------------------------------
function tasksHtml(ts, total) {
  const max = 4, more = (total || ts.length) - Math.min(max, ts.length);
  return `<ul class="tasks">${ts.slice(0, max).map(t =>
    `<li>${esc(t.day.slice(8, 10) + '.' + t.day.slice(5, 7))} · <a href="${esc(t.url || '#')}" target="_blank" rel="noopener">${esc(t.id)}</a> ${esc(t.name)}</li>`).join('')}` +
    (more > 0 ? `<li class="sub">и ещё ${more}</li>` : '') + '</ul>';
}

function pointHtml(it, p, i) {
  const k = pkey(it, i), d = dec[k], two = it.points.length > 1;
  const tag = two ? `<span class="tag" style="background:${COLORS[i % COLORS.length]}">${LETTERS[i]}</span>`
    : '<span class="tag e">?</span>';
  const q = encodeURIComponent([p.name, p.macros[0] || p.region, p.country].filter(Boolean).join(', '));
  // одинаковый регион модели у обоих мест пары — строка файла применится к обоим
  const clash = two && it.points.some((o, j) => j !== i && p.macros.some(m => o.macros.includes(m)));
  // модель назвала один регион, а её же координаты (или найденная точка) — в другом
  const named = p.macros.filter(Boolean);
  const mismatch = named.length && p.region && !named.includes(p.region);
  return `<div class="pt">
    <div>${tag}<span class="meta">точка в</span> <b>${esc(p.region || p.country || '—')}</b> <span class="meta">${p.lat.toFixed(3)}, ${p.lon.toFixed(3)} ·
      ${(p.src || []).map(s => SRC[s] || s).join(', ')}${p.checked ? ' · проверено' : ''}</span></div>
    <div class="meta" style="margin-left:22px">регион в ответе модели: ${esc(p.macros.filter(Boolean).join('; ') || '—')}</div>
    ${mismatch ? '<div class="warn">Регион точки и регион в ответе модели не совпадают — точка, скорее всего, не там</div>' : ''}
    ${tasksHtml(p.tasks, p.ntasks)}
    ${clash ? '<div class="warn">У обоих мест один регион модели — правка применится к обоим</div>' : ''}
    <div class="acts">
      <button class="ok${d && d.type === 'ok' ? ' on' : ''}" data-act="ok" data-i="${i}">Верно</button>
      <button class="pick${picking && picking[0] === it.id && picking[1] === i ? ' on' : ''}" data-act="pick" data-i="${i}">Указать на карте</button>
      <input placeholder="широта, долгота" data-act="paste" data-i="${i}">
      <a href="https://yandex.ru/maps/?text=${q}" target="_blank" rel="noopener">Яндекс</a>
      <a href="https://www.openstreetmap.org/search?query=${q}" target="_blank" rel="noopener">OSM</a>
      ${d ? `<button data-act="reset" data-i="${i}">Сброс</button>` : ''}
      ${it.points.length === 1 ? `<button class="skip${d && d.type === 'skip' ? ' on' : ''}" data-act="skip" data-i="${i}">Не топоним</button>` : ''}
    </div>
    ${d ? `<div class="dec ${d.type}">${d.type === 'skip' ? '✕ не топоним — убрать отовсюду' : d.type === 'ok' ? (pinned(p) ? `✓ верно — закрепить точку модели ${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}` : '✓ проверено — оставить как есть')
      : `→ ${d.merged ? 'одно место: ' : 'новая точка '}${d.lat}, ${d.lon}${d.region ? ` · <b>${esc(d.region)}</b>` : ''}`}</div>` : ''}
  </div>`;
}

function render() {
  document.querySelectorAll('.tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === tab);
    b.textContent = TABS[b.dataset.tab] + ' ' + DATA[b.dataset.tab].length;
  });
  const list = document.getElementById('list');
  const its = items();
  const shown = tab === 'all' ? its.slice(0, SHOW_MAX) : its;
  list.innerHTML = shown.length ? shown.map(it => {
    const done = it.points.every((p, i) => dec[pkey(it, i)]);
    const gone = it.points.every((p, i) => (dec[pkey(it, i)] || {}).type === 'skip');
    return `<div class="item${it.id === selId ? ' sel' : ''}${done ? ' done' : ''}${gone ? ' gone' : ''}" data-id="${it.id}">
      <h3>${esc(it.name)} <span class="sub">${esc(it.country || '')}</span>${it.km ? `<span class="km">${it.km} км</span>` : ''}${it.n ? `<span class="sub" style="margin-left:auto">задач ${it.n}</span>` : ''}</h3>
      ${it.points.map((p, i) => pointHtml(it, p, i)).join('')}
      ${it.points.length > 1 ? `<div class="acts merge"><span class="meta">Это одно место:</span>
        ${it.points.map((p, i) => `<button data-act="merge" data-i="${i}">как ${LETTERS[i]}</button>`).join('')}
        <button class="pick${picking && picking[0] === it.id && picking[1] === 'all' ? ' on' : ''}" data-act="pick" data-i="all">указать на карте</button>
        <span class="grow"></span>
        <button class="skip${gone ? ' on' : ''}" data-act="skip" data-i="0">Не топоним</button>
      </div>` : ''}
    </div>`;
  }).join('') + (its.length > shown.length ? `<div class="empty">Показаны ${shown.length} из ${its.length} — уточните поиск</div>` : '')
    : `<div class="empty">${query() ? 'Ничего не нашлось' : tab === 'pairs' ? 'Подозрительных пар нет' : 'Оценок модели без отметки нет'}</div>`;
  const n = rows().length;
  const save = document.getElementById('save');
  save.disabled = !n;
  save.textContent = n ? `Сохранить (${n} ${n % 10 === 1 && n % 100 !== 11 ? 'строка' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'строки' : 'строк'})` : 'Сохранить';
}

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  tab = b.dataset.tab; selId = null; picking = null; document.getElementById('hint').hidden = true;
  render(); drawMap(false);
  document.getElementById('list').scrollTop = 0;
});

document.getElementById('list').addEventListener('click', e => {
  const card = e.target.closest('.item');
  if (!card) return;
  const it = byId(card.dataset.id);
  const a = e.target.closest('[data-act]');
  const changed = selId !== it.id;
  selId = it.id;
  if (a && a.tagName !== 'A') {
    const i = a.dataset.i === 'all' ? 'all' : +a.dataset.i;
    if (a.dataset.act === 'ok') toggleOk(it, i);
    if (a.dataset.act === 'reset') reset(it, i);
    if (a.dataset.act === 'skip') toggleSkip(it);
    if (a.dataset.act === 'merge') { const c = coordsOf(it, i); setMerged(it, c[0], c[1]); drawMap(true); }
    if (a.dataset.act === 'pick') {
      picking = picking && picking[0] === it.id && picking[1] === i ? null : [it.id, i];
      document.getElementById('hint').hidden = !picking;
    }
    if (a.dataset.act === 'paste') {
      if (changed) {                       // карточка перерисуется — вернуть курсор в поле
        render(); drawMap(true);
        const inp = document.querySelector(`.item[data-id="${it.id}"] input[data-i="${i}"]`);
        if (inp) inp.focus();
      }
      return;
    }
  }
  if (a && a.tagName === 'A') return;
  render(); drawMap(changed);
});

let qTimer;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { render(); document.getElementById('list').scrollTop = 0; }, 150);
});

document.getElementById('list').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.dataset.act !== 'paste') return;
  const c = parseCoords(e.target.value);
  const it = byId(e.target.closest('.item').dataset.id);
  if (!c) { e.target.style.borderColor = 'var(--warn)'; return; }
  setCoords(it, +e.target.dataset.i, c[0], c[1]);
  drawMap(true);
});
document.getElementById('list').addEventListener('paste', e => {
  if (e.target.dataset.act !== 'paste') return;
  setTimeout(() => {
    const c = parseCoords(e.target.value);
    if (c) { setCoords(byId(e.target.closest('.item').dataset.id), +e.target.dataset.i, c[0], c[1]); drawMap(true); }
  });
});

document.getElementById('save').addEventListener('click', async () => {
  const body = rows(), msg = document.getElementById('msg'), btn = document.getElementById('save');
  btn.disabled = true; msg.textContent = 'Сохраняю и переношу в архив…';
  try {
    const r = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    dec = {}; keep();
    location.reload();
  } catch (err) {
    msg.textContent = 'Не сохранилось: ' + err.message; btn.disabled = false;
  }
});

document.getElementById('info').textContent =
  `архив на ${DATA.at} · в geo-manual.csv мест: ${DATA.manualCount}`;
render();
</script>
</body>
</html>
