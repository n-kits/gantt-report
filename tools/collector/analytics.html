<!doctype html>
<!--
  Тестовый стенд вкладки «Аналитика» (дашборд + «Связи»). Данные подставляет tools/collector/analytics.py →
  in/analytics.html (локально, в .gitignore: там реальные заказы и исполнители). Код вкладки — общий с будущей главной:
  js/analytics/*.js, css/analytics.css. На главной вместо __DATA__ — расшифрованный analytics.json из ветки data.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лента времени — стенд аналитики</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/analytics.css">
</head>
<body>
  <header class="banner">
    <div class="banner-text">
      <h1>Лента времени</h1>
      <p class="subtitle">Тестовый стенд вкладки «Аналитика» · данные из локального архива встроены в страницу</p>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Вкладки">
    <a role="tab" id="tab-timeline" href="#timeline" aria-controls="panel-timeline">Лента</a>
    <a role="tab" id="tab-analytics" href="#analytics" aria-controls="panel-analytics">Аналитика</a>
  </nav>

  <section id="panel-timeline" role="tabpanel" aria-labelledby="tab-timeline" hidden>
    <main><p style="padding:24px 0">На стенде вкладка «Лента» — заглушка; сама лента — на <a href="../index.html">главной</a>.</p></main>
  </section>

  <!-- разметка вкладки — из index.html (между метками analytics:begin / analytics:end), подставляет analytics.py -->
__PANEL__
  <script>window.ANALYTICS_DATA = __DATA__;</script>
  <script src="../js/analytics/data.js"></script>
  <script src="../js/analytics/dashboard.js"></script>
  <script src="../js/analytics/bundling.js"></script>
  <script src="../js/analytics/sankey.js"></script>
  <script src="../js/analytics/app.js"></script>
  <script>
  // вкладки по адресу (#timeline / #analytics); на главной это возьмёт на себя js/app.js
  (function () {
    'use strict';
    const A = window.GanttAnalytics;
    let loaded = false;
    function show() {
      const tab = location.hash === '#timeline' ? 'timeline' : 'analytics';
      if (show.tab && show.tab !== tab) scrollTo(0, 0);
      show.tab = tab;
      ['timeline', 'analytics'].forEach(k => {
        document.getElementById('tab-' + k).setAttribute('aria-selected', String(k === tab));
        document.getElementById('panel-' + k).hidden = k !== tab;
      });
      A.setVisible(tab === 'analytics');
      if (tab === 'analytics' && !loaded) { loaded = true; document.getElementById('panel-analytics').classList.remove('an-wait'); A.setData(window.ANALYTICS_DATA); }
    }
    addEventListener('hashchange', show);
    show();
  })();
  </script>
</body>
</html>
